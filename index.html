<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a5cf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рофл">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Рофл-Мессенджер</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f14; color: #e8e8ed; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* ===== Экран авторизации ===== */
#auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; gap: 12px; }
#auth-screen h1 { font-size: 22px; margin-bottom: 16px; }
#auth-screen input { width: 100%; max-width: 320px; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a36; background: #1a1a24; color: #e8e8ed; font-size: 15px; outline: none; font-family: inherit; }
#auth-screen input:focus { border-color: #4a5cf5; }
#auth-screen button { width: 100%; max-width: 320px; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
#login-btn { background: #4a5cf5; color: #fff; }
#register-btn { background: transparent; color: #8a9cff; border: 1px solid #3a3a4a; }
#auth-error { color: #ff6b6b; font-size: 13px; text-align: center; min-height: 18px; max-width: 320px; }
#nickname-hint { font-size: 11px; color: #666; max-width: 320px; text-align: center; }

/* ===== Экран чата ===== */
#chat-screen { display: flex; flex-direction: column; height: 100%; }
header { padding: 10px 16px; background: #1a1a24; border-bottom: 1px solid #2a2a36; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 10px; }
.header-title { display: flex; flex-direction: column; min-width: 0; }
.header-title .title { font-size: 16px; font-weight: 600; }
.header-title .subtitle { font-size: 11px; color: #888; }
.header-right { display: flex; align-items: center; gap: 10px; }
#my-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 14px; flex-shrink: 0; }
#logout { background: none; border: 1px solid #3a3a4a; color: #888; font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; }
#logout:hover { color: #fff; border-color: #666; }

#messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.empty-state { color: #666; text-align: center; padding: 40px 20px; font-size: 14px; }

.msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
.msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
.msg-row:not(.own) { align-self: flex-start; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; flex-shrink: 0; font-size: 13px; }
.msg-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.msg-meta { font-size: 11px; color: #888; padding: 0 6px; display: flex; gap: 6px; }
.msg-row.own .msg-meta { justify-content: flex-end; }
.msg-meta .nick { color: #aaa; font-weight: 600; }
.msg { padding: 8px 12px; border-radius: 14px; background: #2a2a36; color: #e8e8ed; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.msg-row.own .msg { background: #4a5cf5; color: #fff; border-bottom-right-radius: 4px; }
.msg-row:not(.own) .msg { border-bottom-left-radius: 4px; }
#counter { padding: 6px 16px; font-size: 12px; color: #888; background: #1a1a24; text-align: center; border-top: 1px solid #2a2a36; flex-shrink: 0; }
#counter.warn { color: #ff9060; font-weight: 600; }
#input-area { padding: 12px 16px; background: #1a1a24; border-top: 1px solid #2a2a36; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
#input { flex: 1; background: #0f0f14; border: 1px solid #2a2a36; color: #e8e8ed; padding: 10px 14px; border-radius: 20px; font-size: 15px; outline: none; font-family: inherit; min-width: 0; }
#input:focus { border-color: #4a5cf5; }
#input:disabled { opacity: 0.5; }
#send { background: #4a5cf5; border: none; color: white; padding: 10px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 15px; font-family: inherit; }
#send:disabled { background: #333; color: #777; cursor: not-allowed; }

#game-canvas { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; background: #0f0f14; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>

<div id="auth-screen">
  <h1>💬 Рофл-Мессенджер</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="nickname" type="text" placeholder="Никнейм (для регистрации)" maxlength="16" autocomplete="off">
  <input id="password" type="password" placeholder="Пароль (мин 6 символов)" autocomplete="current-password">
  <div id="nickname-hint">Никнейм нужен только при регистрации. При входе можно оставить пустым.</div>
  <button id="login-btn">Войти</button>
  <button id="register-btn">Зарегистрироваться</button>
  <div id="auth-error"></div>
</div>

<div id="chat-screen" style="display:none;">
  <header>
    <div class="header-title">
      <div class="title">💬 Общий чат</div>
      <div class="subtitle" id="header-subtitle">Рофл-мессенджер</div>
    </div>
    <div class="header-right">
      <div id="my-avatar">?</div>
      <button id="logout">Выйти</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="counter">Осталось: 75 символов</div>
  <div id="input-area">
    <input id="input" placeholder="Напиши что-нибудь..." autocomplete="off">
    <button id="send">→</button>
  </div>
</div>

<canvas id="game-canvas"></canvas>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ⚠️ ВСТАВЬ СВОИ ЗНАЧЕНИЯ СЮДА:
const SUPABASE_URL = 'https://cahqjwitbqhmduqehwfx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eskiFaAhtxXEkDUTgYxyqA_yZhLIpEo';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const LIMIT = 75;
const GAME_DURATION = 8000;
const SPAWN_INTERVAL = 220;
const FALL_SPEED = 0.3;
const EMOJIS = ['😀','😂','🤡','💩','👽','🤖','🐸','🍕','🚀','💎','🔥','🌈'];
const GAME_TYPES = ['catch', 'reaction', 'bounce'];
const CHAT_ID = 'general';
const AVATAR_COLORS = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#00d2d3','#1dd1a1','#ff9f43','#ee5253','#c56cf0','#17c0eb'];

let charCount = parseInt(localStorage.getItem('rfl_charCount') || '0');
if (charCount > LIMIT) {
  charCount = 0;
  localStorage.setItem('rfl_charCount', 0);
}
let currentUser = null;
let currentNickname = '';
let channel = null;

const $ = id => document.getElementById(id);
const authScreen = $('auth-screen');
const chatScreen = $('chat-screen');
const messagesEl = $('messages');
const counterEl = $('counter');
const inputEl = $('input');
const sendBtn = $('send');
const canvas = $('game-canvas');
const ctx = canvas.getContext('2d');

function showAuth() { authScreen.style.display = 'flex'; chatScreen.style.display = 'none'; }
function showChat() { authScreen.style.display = 'none'; chatScreen.style.display = 'flex'; }

function colorFor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

function initialOf(name) {
  if (!name) return '?';
  return name.trim()[0].toUpperCase();
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

async function doLogin() {
const email = $('email').value.trim();
  const password = $('password').value;
  $('auth-error').textContent = '';
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) $('auth-error').textContent = error.message;
}

async function doRegister() {
  const email = $('email').value.trim();
  const nickname = $('nickname').value.trim();
  const password = $('password').value;
  $('auth-error').textContent = '';
  if (!nickname) { $('auth-error').textContent = 'Придумай никнейм'; return; }
  if (nickname.length > 16) { $('auth-error').textContent = 'Никнейм до 16 символов'; return; }
  if (password.length < 6) { $('auth-error').textContent = 'Пароль минимум 6 символов'; return; }
  const { error } = await supabase.auth.signUp({
    email, password,
    options: { data: { nickname } }
  });
  if (error) { $('auth-error').textContent = error.message; return; }
  $('auth-error').textContent = 'Готово! Теперь войди.';
}

async function doLogout() {
  await supabase.auth.signOut();
}

function renderMessage(m) {
  const isOwn = currentUser && m.user_id === currentUser.id;
  const nick = m.nickname || 'Анон';
  const color = colorFor(m.user_id || nick);

  const row = document.createElement('div');
  row.className = 'msg-row' + (isOwn ? ' own' : '');

  if (!isOwn) {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = color;
    av.textContent = initialOf(nick);
    row.appendChild(av);
  }

  const body = document.createElement('div');
  body.className = 'msg-body';

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (!isOwn) {
    const n = document.createElement('span');
    n.className = 'nick';
    n.style.color = color;
    n.textContent = nick;
    meta.appendChild(n);
  }
  const t = document.createElement('span');
  t.textContent = fmtTime(m.created_at);
  meta.appendChild(t);
  body.appendChild(meta);

  const bubble = document.createElement('div');
  bubble.className = 'msg';
  bubble.textContent = m.content;
  body.appendChild(bubble);

  row.appendChild(body);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadMessages() {
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .eq('chat_id', CHAT_ID)
    .order('created_at', { ascending: true })
    .limit(200);
  if (error) { console.error(error); return; }
  messagesEl.innerHTML = '';
  if (data.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Пока сообщений нет. Напиши первым! 👋';
    messagesEl.appendChild(empty);
    return;
  }
  data.forEach(renderMessage);
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  if (charCount >= LIMIT) { startGame(); return; }
  if (charCount + text.length > LIMIT) {
    alert(`Осталось ${LIMIT - charCount} символов. Сократи сообщение.`);
    return;
  }
  const { error } = await supabase.from('messages').insert({
    content: text,
    user_id: currentUser.id,
    chat_id: CHAT_ID,
    nickname: currentNickname
  });
  if (error) { alert('Ошибка: ' + error.message); return; }
  inputEl.value = '';
  charCount += text.length;
  localStorage.setItem('rfl_charCount', charCount);
  updateCounter();
  if (charCount >= LIMIT) setTimeout(startGame, 300);
}

function updateCounter() {
  const left = Math.max(0, LIMIT - charCount);
  counterEl.textContent = `Осталось: ${left} символов`;
  counterEl.classList.toggle('warn', left <= 50);
  const locked = charCount >= LIMIT;
  inputEl.disabled = locked;
  sendBtn.disabled = locked;
  inputEl.placeholder = locked ? '🎮 Сначала поиграй...' : 'Напиши что-нибудь...';
}

function subscribeRealtime() {
  if (channel) supabase.removeChannel(channel);
  channel = supabase
    .channel('room:' + CHAT_ID)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
table: 'messages',
      filter: `chat_id=eq.${CHAT_ID}`
    }, (payload) => {
      if (messagesEl.querySelector('.empty-state')) messagesEl.innerHTML = '';
      renderMessage(payload.new);
    })
    .subscribe();
}

async function onSignedIn(user) {
  if (currentUser && currentUser.id === user.id) return;
  currentUser = user;
  currentNickname = user.user_metadata?.nickname || user.email.split('@')[0];

  const myAv = $('my-avatar');
  myAv.style.background = colorFor(user.id);
  myAv.textContent = initialOf(currentNickname);
  $('header-subtitle').textContent = 'Ты: ' + currentNickname;

  showChat();
  await loadMessages();
  subscribeRealtime();
  updateCounter();
}

const game = {
  active: false,
  type: '',
  startTime: 0,
  lastFrame: 0,
  lastSpawn: 0,
  score: 0,
  items: []
};

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function startGame() {
  if (game.active) return;
  resizeCanvas();
  game.active = true;
  game.type = GAME_TYPES[Math.floor(Math.random() * GAME_TYPES.length)];
  game.startTime = performance.now();
  game.lastFrame = game.startTime;
  game.lastSpawn = game.startTime;
  game.score = 0;
  game.items = [];
  canvas.style.display = 'block';
  requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  if (!game.active) return;
  const delta = Math.min(100, now - game.lastFrame);
  game.lastFrame = now;
  const elapsed = now - game.startTime;
  const timeLeft = Math.max(0, GAME_DURATION - elapsed);
  const W = window.innerWidth, H = window.innerHeight;

  ctx.clearRect(0, 0, W, H);

  if (game.type === 'catch') updateCatch(now, delta, W, H);
  else if (game.type === 'reaction') updateReaction(now, W, H);
  else if (game.type === 'bounce') updateBounce(delta, W, H);

  drawHUD(W, timeLeft);

  if (timeLeft <= 0) { endGame(); return; }
  requestAnimationFrame(gameLoop);
}

function updateCatch(now, delta, W, H) {
  if (now - game.lastSpawn > SPAWN_INTERVAL) {
    game.items.push({
      x: 40 + Math.random() * (W - 80),
      y: -40,
      emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
    });
    game.lastSpawn = now;
  }
  ctx.font = '40px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  game.items = game.items.filter(e => e.y < H + 60);
  for (const e of game.items) {
    e.y += FALL_SPEED * delta;
    ctx.fillText(e.emoji, e.x, e.y);
  }
}

function updateReaction(now, W, H) {
  if (now - game.lastSpawn > 320) {
    game.items.push({
      x: 60 + Math.random() * (W - 120),
      y: 100 + Math.random() * (H - 200),
      bornAt: now,
      life: 500 + Math.random() * 350,
      color: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)]
    });
    game.lastSpawn = now;
  }
  game.items = game.items.filter(t => now - t.bornAt < t.life);
  for (const t of game.items) {
    const age = now - t.bornAt;
    ctx.globalAlpha = 1 - age / t.life;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '26px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⭐', t.x, t.y);
    ctx.globalAlpha = 1;
  }
}

function updateBounce(delta, W, H) {
  if (game.items.length === 0) {
    game.items.push({
      x: W / 2, y: H / 2,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      r: 35
    });
  }
  const b = game.items[0];
  b.x += b.vx * delta;
  b.y += b.vy * delta;
  if (b.x < b.r || b.x > W - b.r) { b.vx *= -1; b.vy += (Math.random() - 0.5) * 0.1; b.x = Math.max(b.r, Math.min(W - b.r, b.x)); }
  if (b.y < b.r + 80 || b.y > H - b.r) { b.vy *= -1; b.vx += (Math.random() - 0.5) * 0.1; b.y = Math.max(b.r + 80, Math.min(H - b.r, b.y)); }

  ctx.fillStyle = '#4a5cf5';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '34px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎾', b.x, b.y);
}

function drawHUD(W, timeLeft) {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`⏱ ${(timeLeft/1000).toFixed(1)}`, 20, 24);
  ctx.textAlign = 'right';
  ctx.fillText(`Счёт: ${game.score}`, W - 20, 24);
  const p = timeLeft / GAME_DURATION;
ctx.fillStyle = '#2a2a36';
  ctx.fillRect(20, 48, W - 40, 8);
  ctx.fillStyle = '#4a5cf5';
  ctx.fillRect(20, 48, (W - 40) * p, 8);

  const names = { catch: '🎯 Лови!', reaction: '⚡ Успей кликнуть!', bounce: '🎾 Попади по шарику!' };
  ctx.fillStyle = '#aaa';
  ctx.font = '13px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(names[game.type] || '', 20, 88);
}

canvas.addEventListener('pointerdown', (e) => {
  if (!game.active) return;
  e.preventDefault();
  const mx = e.clientX, my = e.clientY;

  if (game.type === 'catch') {
    for (let i = game.items.length - 1; i >= 0; i--) {
      const em = game.items[i], dx = mx - em.x, dy = my - em.y;
      if (dx*dx + dy*dy < 40*40) { game.score++; game.items.splice(i, 1); break; }
    }
  } else if (game.type === 'reaction') {
    for (let i = game.items.length - 1; i >= 0; i--) {
      const t = game.items[i], dx = mx - t.x, dy = my - t.y;
      if (dx*dx + dy*dy < 38*38) { game.score++; game.items.splice(i, 1); break; }
    }
  } else if (game.type === 'bounce') {
    const b = game.items[0];
    if (!b) return;
    const dx = mx - b.x, dy = my - b.y;
    if (dx*dx + dy*dy < (b.r + 15) * (b.r + 15)) {
      game.score++;
      b.x = 80 + Math.random() * (window.innerWidth - 160);
      b.y = 140 + Math.random() * (window.innerHeight - 240);
      b.vx = (Math.random() - 0.5) * 1.3;
      b.vy = (Math.random() - 0.5) * 1.3;
    }
  }
});

function endGame() {
  game.active = false;
  canvas.style.display = 'none';
  charCount = 0;
  localStorage.setItem('rfl_charCount', 0);
  updateCounter();
  const names = { catch: 'Ловля', reaction: 'Реакция', bounce: 'Шарик' };
  const praise = game.score > 10 ? 'Ого, ты монстр! 🏆'
               : game.score > 5 ? 'Неплохо! 👏'
               : 'Ну хоть поиграл 😄';
  alert(`Игра «${names[game.type]}» окончена!\nСчёт: ${game.score}\n${praise}\n\nСчётчик сброшен.`);
}
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function startGame() {
  if (game.active) return;
  resizeCanvas();
  game.active = true;
  game.startTime = performance.now();
  game.lastFrame = game.startTime;
  game.lastSpawn = game.startTime;
  game.score = 0;
  game.emojis = [];
  canvas.style.display = 'block';
  requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  if (!game.active) return;
  const delta = Math.min(100, now - game.lastFrame);
  game.lastFrame = now;
  const elapsed = now - game.startTime;
  const timeLeft = Math.max(0, GAME_DURATION - elapsed);
  const W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  if (now - game.lastSpawn > SPAWN_INTERVAL) {
    game.emojis.push({ x: 40 + Math.random() * (W - 80), y: -40, emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)] });
    game.lastSpawn = now;
  }
  ctx.font = '40px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  game.emojis = game.emojis.filter(e => e.y < H + 60);
  for (const e of game.emojis) { e.y += FALL_SPEED * delta; ctx.fillText(e.emoji, e.x, e.y); }
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`⏱ ${(timeLeft/1000).toFixed(1)}`, 20, 24);
  ctx.textAlign = 'right'; ctx.fillText(`Счёт: ${game.score}`, W - 20, 24);
  const p = timeLeft / GAME_DURATION;
  ctx.fillStyle = '#2a2a36'; ctx.fillRect(20, 48, W - 40, 8);
  ctx.fillStyle = '#4a5cf5'; ctx.fillRect(20, 48, (W - 40) * p, 8);
  if (timeLeft <= 0) { endGame(); return; }
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('pointerdown', (e) => {
  if (!game.active) return;
  const mx = e.clientX, my = e.clientY;
  for (let i = game.emojis.length - 1; i >= 0; i--) {
    const em = game.emojis[i], dx = mx - em.x, dy = my - em.y;
    if (dx*dx + dy*dy < 40*40) { game.score++; game.emojis.splice(i, 1); break; }
  }
});

function endGame() {
  game.active = false;
  canvas.style.display = 'none';
  charCount = 0;
  localStorage.setItem('rfl_charCount', 0);
  updateCounter();
  alert(`Игра окончена!\nСчёт: ${game.score}\n\nСчётчик сброшен.`);
}

supabase.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) onSignedIn(session.user);
    if (event === 'SIGNED_OUT') { currentUser = null; showAuth(); }
  }, 0);
});

$('login-btn').addEventListener('click', doLogin);
$('register-btn').addEventListener('click', doRegister);
$('logout').addEventListener('click', doLogout);
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) await onSignedIn(session.user);
  else showAuth();
})();
</script>
