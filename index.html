<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4a54a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Шиноби">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<title>⛩️ Шиноби-Чат</title>
<style>
:root {
  --bg: #0a0a0f; --bg-card: #16161f; --bg-elev: #1f1f2e;
  --gold: #d4a54a; --gold-dim: #8a6f2f;
  --jade: #1dd1a1; --fire: #ee5253; --ice: #48dbfb;
  --lightning: #feca57; --earth: #7a7a8a; --water: #00d2d3; --energy: #a29bfe;
  --text: #ece9e2; --text-dim: #8a8a9a;
  --border: #2a2a3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

h1, .header-title .title { font-family: 'Noto Serif JP', serif; font-weight: 900; letter-spacing: 0.5px; }

#auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; gap: 12px; background: radial-gradient(circle at 50% 30%, #1a1520, #0a0a0f); }
#auth-screen h1 { font-size: 26px; margin-bottom: 16px; color: var(--gold); text-shadow: 0 2px 8px rgba(212,165,74,0.3); }
#auth-screen input { width: 100%; max-width: 320px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 15px; outline: none; font-family: inherit; }
#auth-screen input:focus { border-color: var(--gold); }
#auth-screen button { width: 100%; max-width: 320px; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
#login-btn { background: var(--gold); color: #1a1a1a; }
#register-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); }
#auth-error { color: var(--fire); font-size: 13px; text-align: center; min-height: 18px; max-width: 320px; }
#nickname-hint { font-size: 11px; color: var(--text-dim); max-width: 320px; text-align: center; }

#chat-screen, #profile-screen, #games-menu, #chats-list-screen { display: none; flex-direction: column; height: 100%; }

header { padding: 10px 14px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 8px; }
.header-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.header-title .title { font-size: 16px; color: var(--gold); }
.header-title .subtitle { font-size: 11px; color: var(--text-dim); }
.header-right { display: flex; align-items: center; gap: 8px; }

#menu-btn, #back-to-chat, #close-games, #back-to-chat-from-list { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 14px; }
#menu-btn:hover, #back-to-chat:hover, #close-games:hover, #back-to-chat-from-list:hover { color: var(--gold); border-color: var(--gold-dim); }

#my-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 16px; flex-shrink: 0; cursor: pointer; }
#play-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); font-size: 16px; padding: 4px 8px; border-radius: 6px; cursor: pointer; line-height: 1; }
#play-btn:hover { color: var(--gold); border-color: var(--gold-dim); }
#logout { background: none; border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; }
#logout:hover { color: var(--fire); border-color: var(--fire); }

#messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.empty-state { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 14px; }

.msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
.msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
.msg-row:not(.own) { align-self: flex-start; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; flex-shrink: 0; font-size: 16px; }
.msg-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.msg-meta { font-size: 11px; color: var(--text-dim); padding: 0 6px; display: flex; gap: 6px; }
.msg-row.own .msg-meta { justify-content: flex-end; }
.msg-meta .nick { font-weight: 600; }
.msg { padding: 8px 12px; border-radius: 14px; background: var(--bg-elev); color: var(--text); font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.msg-row.own .msg { background: linear-gradient(135deg, var(--gold-dim), var(--gold)); color: #1a1a1a; font-weight: 500; border-bottom-right-radius: 4px; }
.msg-row:not(.own) .msg { border-bottom-left-radius: 4px; }

#input-area { padding: 12px 14px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
#input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 20px; font-size: 15px; outline: none; font-family: inherit; min-width: 0; }
#input:focus { border-color: var(--gold); }
#send { background: var(--gold); border: none; color: #1a1a1a; padding: 10px 18px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 15px; font-family: inherit; }

#profile-content { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
#pet-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 24px; background: linear-gradient(135deg, var(--bg-card), var(--bg-elev)); border: 1px solid var(--gold-dim); border-radius: 24px; min-width: 240px; }
#pet-emoji { font-size: 96px; line-height: 1; }
#pet-name { font-size: 24px; font-weight: 700; }
#pet-subtitle { font-size: 12px; color: var(--text-dim); }
#char-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 360px; }
.char-item { padding: 12px 4px; background: var(--bg-card); border: 2px solid transparent; border-radius: 14px; cursor: pointer; text-align: center; font-family: inherit; color: var(--text); transition: all 0.15s; }
.char-item:hover { background: var(--bg-elev); }
.char-item.selected { border-color: var(--gold); background: var(--bg-elev); }
.char-item .ci-emoji { font-size: 32px; display: block; line-height: 1; }
.char-item .ci-name { font-size: 11px; color: var(--text-dim); margin-top: 6px; display: block; }
.char-item .ci-element { font-size: 10px; color: var(--gold); margin-top: 2px; display: block; opacity: 0.7; }
.picker-title { font-size: 13px; color: var(--text-dim); align-self: flex-start; }

#games-list, #chats-list { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.game-card, .chat-card { padding: 16px 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-family: inherit; color: var(--text); text-align: left; transition: all 0.15s; width: 100%; }
.game-card:hover, .chat-card:hover { background: var(--bg-elev); border-color: var(--gold-dim); }
.game-card:active, .chat-card:active { transform: scale(0.98); }
.gc-emoji { font-size: 40px; flex-shrink: 0; }
.gc-info { flex: 1; min-width: 0; }
.gc-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--gold); }
.gc-desc { font-size: 12px; color: var(--text-dim); }
.gc-badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: var(--bg-elev); color: var(--text-dim); flex-shrink: 0; }
.gc-badge.endless { background: var(--gold); color: #1a1a1a; font-weight: 700; }
.chat-card.active { border-color: var(--gold); background: var(--bg-elev); }

#new-chat-btn { padding: 14px; background: var(--gold); color: #1a1a1a; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 15px; margin: 12px 16px; }

#game-canvas { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; background: var(--bg); cursor: crosshair; touch-action: none; }
</style>
</head>
<body>

<div id="auth-screen">
  <h1>⛩️ Шиноби-Чат</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="nickname" type="text" placeholder="Никнейм (для регистрации)" maxlength="16" autocomplete="off">
  <input id="password" type="password" placeholder="Пароль (мин 6 символов)" autocomplete="current-password">
  <div id="nickname-hint">Никнейм нужен только при регистрации. При входе можно оставить пустым.</div>
  <button id="login-btn">Войти</button>
  <button id="register-btn">Зарегистрироваться</button>
  <div id="auth-error"></div>
</div>

<div id="chat-screen">
  <header>
    <button id="menu-btn" title="Список чатов">☰</button>
    <div class="header-title">
      <div class="title" id="current-chat-name">Общий чат</div>
      <div class="subtitle" id="header-subtitle">Шиноби-чат</div>
    </div>
    <div class="header-right">
      <div id="my-avatar">?</div>
      <button id="play-btn" title="Испытания">🎮</button>
      <button id="logout">Выйти</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="input-area">
    <input id="input" placeholder="Скажи слово..." autocomplete="off">
    <button id="send">→</button>
  </div>
</div>

<div id="chats-list-screen">
  <header>
    <button id="back-to-chat-from-list">← В чат</button>
    <div class="header-title"><div class="title">📜 Чаты</div></div>
    <div style="width:60px;"></div>
  </header>
  <button id="new-chat-btn">✉️ Новый чат по email</button>
  <div id="chats-list"></div>
</div>

<div id="profile-screen">
  <header>
    <button id="back-to-chat">← Назад</button>
    <div class="header-title"><div class="title">👤 Профиль</div></div>
    <div style="width:60px;"></div>
  </header>
  <div id="profile-content">
    <div id="pet-card">
      <div id="pet-emoji">🔥</div>
      <div id="pet-name">Кайто</div>
      <div id="pet-subtitle" id="pet-element">Стихия: Огонь</div>
    </div>
    <div class="picker-title">Выбери персонажа:</div>
    <div id="char-list"></div>
  </div>
</div>

<div id="games-menu">
  <header>
    <button id="close-games">← Назад</button>
    <div class="header-title"><div class="title">⚔️ Испытания</div></div>
    <div style="width:60px;"></div>
  </header>
  <div id="games-list"></div>
</div>

<canvas id="game-canvas"></canvas>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0/+esm';

// ⚠️ ВСТАВЬ СВОИ ЗНАЧЕНИЯ:
const SUPABASE_URL = 'https://cahqjwitbqhmduqehwfx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eskiFaAhtxXEkDUTgYxyqA_yZhLIpEo';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const SPAWN_INTERVAL = 220;
const FALL_SPEED = 0.3;
const EMOJIS = ['⭐','💫','✨','🔥','❄️','⚡','🌪️','🐉','🗡️','⛩️','🌸','🥷'];
const AVATAR_COLORS = ['#ee5253','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#00d2d3','#1dd1a1','#ff9f43','#c56cf0','#17c0eb'];

const CHARACTERS = {
kaito: { name: 'Кайто', emoji: '🔥', color: '#ee5253', element: 'Огонь' },
  zen:   { name: 'Зен',   emoji: '❄️', color: '#48dbfb', element: 'Лёд' },
  jay:   { name: 'Джей',  emoji: '⚡', color: '#feca57', element: 'Молния' },
  cole:  { name: 'Коул',  emoji: '🪨', color: '#7a7a8a', element: 'Земля' },
  nia:   { name: 'Ния',   emoji: '🌊', color: '#00d2d3', element: 'Вода' },
  luka:  { name: 'Люка',  emoji: '✨', color: '#a29bfe', element: 'Энергия' }
};

const GAMES = {
  catch:    { name: 'Ловля сюрикенов', emoji: '🎯', desc: 'Кликай по звёздам ниндзя', duration: 8000 },
  reaction: { name: 'Удар молнии',     emoji: '⚡', desc: 'Успей кликнуть по вспышке', duration: 8000 },
  bounce:   { name: 'Прыжок ниндзя',   emoji: '🥷', desc: 'Попади по летающему сюрикену', duration: 8000 },
  flappy:   { name: 'Полёт дракона',   emoji: '🐉', desc: 'Пролетай между скалами', duration: 0 }
};

let currentUser = null;
let currentNickname = '';
let currentCharacter = 'kaito';
let currentChatId = 'general';
let currentChatName = 'Общий чат';
let myChats = [];
let channel = null;

const $ = id => document.getElementById(id);
const authScreen = $('auth-screen');
const chatScreen = $('chat-screen');
const profileScreen = $('profile-screen');
const gamesMenu = $('games-menu');
const chatsListScreen = $('chats-list-screen');
const messagesEl = $('messages');
const inputEl = $('input');
const sendBtn = $('send');
const canvas = $('game-canvas');
const ctx = canvas.getContext('2d');

function hideAll() {
  [authScreen, chatScreen, profileScreen, gamesMenu, chatsListScreen].forEach(s => s.style.display = 'none');
}
function showAuth() { hideAll(); authScreen.style.display = 'flex'; }
function showChat() { hideAll(); chatScreen.style.display = 'flex'; }
function showProfile() { hideAll(); profileScreen.style.display = 'flex'; renderProfile(); }
function showGamesMenu() { hideAll(); gamesMenu.style.display = 'flex'; renderGamesMenu(); }
function showChatsList() { hideAll(); chatsListScreen.style.display = 'flex'; renderChatsList(); }

function colorFor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

/* ===== AUTH ===== */
async function doLogin() {
  const email = $('email').value.trim();
  const password = $('password').value;
  $('auth-error').textContent = '';
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) $('auth-error').textContent = error.message;
}
async function doRegister() {
  const email = $('email').value.trim();
  const nickname = $('nickname').value.trim();
  const password = $('password').value;
  $('auth-error').textContent = '';
  if (!nickname) { $('auth-error').textContent = 'Придумай никнейм'; return; }
  if (nickname.length > 16) { $('auth-error').textContent = 'Никнейм до 16 символов'; return; }
  if (password.length < 6) { $('auth-error').textContent = 'Пароль минимум 6 символов'; return; }
  const { error } = await supabase.auth.signUp({ email, password, options: { data: { nickname, character: 'kaito' } } });
  if (error) { $('auth-error').textContent = error.message; return; }
  $('auth-error').textContent = 'Готово! Теперь войди.';
}
async function doLogout() { await supabase.auth.signOut(); }

/* ===== MESSAGES ===== */
function renderMessage(m) {
  const isOwn = currentUser && m.user_id === currentUser.id;
  const nick = m.nickname || 'Анон';
  const color = colorFor(m.user_id || nick);
  const char = CHARACTERS[m.character] || null;

  const row = document.createElement('div');
  row.className = 'msg-row' + (isOwn ? ' own' : '');
  if (!isOwn) {
    const av = document.createElement('div');
    av.className = 'avatar';
    if (char) { av.style.background = char.color; av.textContent = char.emoji; }
else { av.style.background = color; av.textContent = nick.trim()[0].toUpperCase(); }
    row.appendChild(av);
  }
  const body = document.createElement('div');
  body.className = 'msg-body';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (!isOwn) {
    const n = document.createElement('span');
    n.className = 'nick';
    n.style.color = char ? char.color : color;
    n.textContent = nick;
    meta.appendChild(n);
  }
  const t = document.createElement('span');
  t.textContent = fmtTime(m.created_at);
  meta.appendChild(t);
  body.appendChild(meta);
  const bubble = document.createElement('div');
  bubble.className = 'msg';
  bubble.textContent = m.content;
  body.appendChild(bubble);
  row.appendChild(body);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadMessages() {
  const { data, error } = await supabase.from('messages')
    .select('*').eq('chat_id', currentChatId)
    .order('created_at', { ascending: true }).limit(200);
  if (error) { console.error(error); return; }
  messagesEl.innerHTML = '';
  if (data.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Тишина... Напиши первым! 🥷';
    messagesEl.appendChild(empty);
    return;
  }
  data.forEach(renderMessage);
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  const { error } = await supabase.from('messages').insert({
    content: text, user_id: currentUser.id, chat_id: currentChatId,
    nickname: currentNickname, character: currentCharacter
  });
  if (error) { alert('Ошибка: ' + error.message); return; }
  inputEl.value = '';
}

function subscribeRealtime() {
  if (channel) supabase.removeChannel(channel);
  channel = supabase.channel('room:' + currentChatId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `chat_id=eq.${currentChatId}`
    }, (payload) => {
      if (messagesEl.querySelector('.empty-state')) messagesEl.innerHTML = '';
      renderMessage(payload.new);
    }).subscribe();
}

async function switchChat(chatId, chatName) {
  currentChatId = chatId;
  currentChatName = chatName;
  $('current-chat-name').textContent = chatName;
  showChat();
  await loadMessages();
  subscribeRealtime();
}

/* ===== CHATS LIST ===== */
async function loadChats() {
  const { data, error } = await supabase.from('user_chats')
    .select('chat_id, chat_name').eq('user_id', currentUser.id);
  if (error) { console.error(error); myChats = []; return; }
  myChats = data || [];
}

function renderChatsList() {
  const list = $('chats-list');
  list.innerHTML = '';
  // Общий чат всегда первый
  const generalBtn = document.createElement('button');
  generalBtn.className = 'chat-card' + (currentChatId === 'general' ? ' active' : '');
  generalBtn.innerHTML = `<span class="gc-emoji">⛩️</span><div class="gc-info"><div class="gc-name">Общий чат</div><div class="gc-desc">Все шиноби здесь</div></div>`;
  generalBtn.addEventListener('click', () => switchChat('general', 'Общий чат'));
  list.appendChild(generalBtn);

  myChats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chat-card' + (currentChatId === c.chat_id ? ' active' : '');
    btn.innerHTML = `<span class="gc-emoji">💬</span><div class="gc-info"><div class="gc-name">${(c.chat_name || 'Личный чат').replace(/</g,'&lt;')}</div><div class="gc-desc">Личная переписка</div></div>`;
    btn.addEventListener('click', () => switchChat(c.chat_id, c.chat_name || 'Личный чат'));
    list.appendChild(btn);
  });
}

async function newChat() {
  const email = prompt('Email друга (он должен быть зарегистрирован):');
  if (!email) return;
  const { data, error } = await supabase.rpc('create_dm', { other_email: email.trim() });
  if (error) { alert('Ошибка: ' + error.message); return; }
  await loadChats();
const found = myChats.find(c => c.chat_id === data);
  await switchChat(data, found ? found.chat_name : 'Личный чат');
}

/* ===== PROFILE ===== */
function updateAvatar() {
  const char = CHARACTERS[currentCharacter] || CHARACTERS.kaito;
  const av = $('my-avatar');
  av.style.background = char.color;
  av.textContent = char.emoji;
}

function renderCharacterList() {
  const list = $('char-list');
  list.innerHTML = '';
  Object.entries(CHARACTERS).forEach(([id, c]) => {
    const btn = document.createElement('button');
    btn.className = 'char-item' + (id === currentCharacter ? ' selected' : '');
    btn.innerHTML = `<span class="ci-emoji">${c.emoji}</span><span class="ci-name">${c.name}</span><span class="ci-element">${c.element}</span>`;
    btn.addEventListener('click', () => selectCharacter(id));
    list.appendChild(btn);
  });
}

function renderProfile() {
  const char = CHARACTERS[currentCharacter] || CHARACTERS.kaito;
  $('pet-emoji').textContent = char.emoji;
  $('pet-name').textContent = char.name;
  $('pet-name').style.color = char.color;
  $('pet-element').textContent = 'Стихия: ' + char.element;
  renderCharacterList();
}

async function selectCharacter(id) {
  currentCharacter = id;
  renderProfile();
  updateAvatar();
  const { error } = await supabase.auth.updateUser({ data: { character: id } });
  if (error) console.error(error);
}

/* ===== ON SIGN IN ===== */
async function onSignedIn(user) {
  if (currentUser && currentUser.id === user.id) return;
  currentUser = user;
  currentNickname = user.user_metadata?.nickname || user.email.split('@')[0];
  currentCharacter = user.user_metadata?.character || 'kaito';
  updateAvatar();
  $('header-subtitle').textContent = 'Ты: ' + currentNickname;
  await loadChats();
  await switchChat('general', 'Общий чат');
}

/* ===== GAMES MENU ===== */
function renderGamesMenu() {
  const list = $('games-list');
  list.innerHTML = '';
  Object.entries(GAMES).forEach(([id, g]) => {
    const btn = document.createElement('button');
    btn.className = 'game-card';
    const badge = g.duration > 0
      ? `<span class="gc-badge">${g.duration/1000} сек</span>`
      : `<span class="gc-badge endless">∞</span>`;
    btn.innerHTML = `<span class="gc-emoji">${g.emoji}</span><div class="gc-info"><div class="gc-name">${g.name}</div><div class="gc-desc">${g.desc}</div></div>${badge}`;
    btn.addEventListener('click', () => startGame(id));
    list.appendChild(btn);
  });
}

/* ===== GAMES ===== */
const game = { active: false, id: '', startTime: 0, lastFrame: 0, lastSpawn: 0, score: 0, items: [], bird: null, pipes: [] };

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function startGame(id) {
  if (game.active) return;
  resizeCanvas();
  game.active = true;
  game.id = id;
  game.startTime = performance.now();
  game.lastFrame = game.startTime;
  game.lastSpawn = game.startTime;
  game.score = 0;
  game.items = [];
  game.bird = null;
  game.pipes = [];
  if (id === 'flappy') game.bird = { x: 80, y: window.innerHeight / 2, vy: 0, r: 20 };
  canvas.style.display = 'block';
  requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  if (!game.active) return;
  const delta = Math.min(50, now - game.lastFrame);
  game.lastFrame = now;
  const elapsed = now - game.startTime;
  const duration = GAMES[game.id].duration;
  const timeLeft = duration > 0 ? Math.max(0, duration - elapsed) : -1;
  const W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);

  if (game.id === 'catch') updateCatch(now, delta, W, H);
  else if (game.id === 'reaction') updateReaction(now, W, H);
  else if (game.id === 'bounce') updateBounce(delta, W, H);
else if (game.id === 'flappy') updateFlappy(now, delta, W, H);

  if (timeLeft === 0) { endGame(); return; }
  drawHUD(W, timeLeft);
  requestAnimationFrame(gameLoop);
}

function updateCatch(now, delta, W, H) {
  if (now - game.lastSpawn > SPAWN_INTERVAL) {
    game.items.push({ x: 40 + Math.random() * (W - 80), y: -40, emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)] });
    game.lastSpawn = now;
  }
  ctx.font = '40px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  game.items = game.items.filter(e => e.y < H + 60);
  for (const e of game.items) { e.y += FALL_SPEED * delta; ctx.fillText(e.emoji, e.x, e.y); }
}

function updateReaction(now, W, H) {
  if (now - game.lastSpawn > 320) {
    game.items.push({ x: 60 + Math.random() * (W - 120), y: 100 + Math.random() * (H - 200), bornAt: now, life: 500 + Math.random() * 350, color: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)] });
    game.lastSpawn = now;
  }
  game.items = game.items.filter(t => now - t.bornAt < t.life);
  for (const t of game.items) {
    const age = now - t.bornAt;
    ctx.globalAlpha = 1 - age / t.life;
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.arc(t.x, t.y, 32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚡', t.x, t.y);
    ctx.globalAlpha = 1;
  }
}

function updateBounce(delta, W, H) {
  if (game.items.length === 0) {
    game.items.push({ x: W / 2, y: H / 2, vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2, r: 35 });
  }
  const b = game.items[0];
  b.x += b.vx * delta; b.y += b.vy * delta;
  if (b.x < b.r || b.x > W - b.r) { b.vx *= -1; b.vy += (Math.random() - 0.5) * 0.1; b.x = Math.max(b.r, Math.min(W - b.r, b.x)); }
  if (b.y < b.r + 80 || b.y > H - b.r) { b.vy *= -1; b.vx += (Math.random() - 0.5) * 0.1; b.y = Math.max(b.r + 80, Math.min(H - b.r, b.y)); }
  ctx.fillStyle = '#d4a54a';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.font = '34px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⭐', b.x, b.y);
}

function updateFlappy(now, delta, W, H) {
  const b = game.bird;
  b.vy += 0.0015 * delta;
  b.y += b.vy * delta;
  if (b.y < b.r || b.y > H - b.r) { endGame(); return; }
  if (now - game.lastSpawn > 1600) {
    const gap = 160;
    const gapY = 100 + Math.random() * (H - 200 - gap);
    game.pipes.push({ x: W, gapY, gap, w: 60, passed: false });
    game.lastSpawn = now;
  }
  const speed = 0.18;
  for (const p of game.pipes) {
    p.x -= speed * delta;
    if (!p.passed && p.x + p.w < b.x) { p.passed = true; game.score++; }
    if (b.x + b.r > p.x && b.x - b.r < p.x + p.w) {
      if (b.y - b.r < p.gapY || b.y + b.r > p.gapY + p.gap) { endGame(); return; }
    }
  }
  game.pipes = game.pipes.filter(p => p.x > -p.w);
  ctx.fillStyle = '#3a3a4a';
  for (const p of game.pipes) {
    ctx.fillRect(p.x, 0, p.w, p.gapY);
    ctx.fillRect(p.x, p.gapY + p.gap, p.w, H - p.gapY - p.gap);
    ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⛰️', p.x + p.w/2, 40);
    ctx.fillText('⛰️', p.x + p.w/2, H - 40);
  }
  ctx.font = '40px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🐉', b.x, b.y);
}

function drawHUD(W, timeLeft) {
  ctx.fillStyle = 'rgba(10,10,15,0.85)';
  ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = '#d4a54a'; ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (timeLeft >= 0) ctx.fillText(`⏱ ${(timeLeft/1000).toFixed(1)}`, 20, 24);
  else ctx.fillText('∞', 20, 24);
  ctx.textAlign = 'right';
  ctx.fillText(`Счёт: ${game.score}`, W - 20, 24);
  if (timeLeft >= 0) {
    const p = timeLeft / GAMES[game.id].duration;
    ctx.fillStyle = '#1f1f2e'; ctx.fillRect(20, 48, W - 40, 8);
    ctx.fillStyle = '#d4a54a'; ctx.fillRect(20, 48, (W - 40) * p, 8);
  }
const hints = { catch: '🎯 Лови сюрикены!', reaction: '⚡ Успей кликнуть!', bounce: '⭐ Попади по звезде!', flappy: '🐉 Кликай, чтобы лететь!' };
  ctx.fillStyle = '#8a8a9a'; ctx.font = '13px system-ui'; ctx.textAlign = 'left';
  ctx.fillText(hints[game.id] || '', 20, 88);
}

canvas.addEventListener('pointerdown', (e) => {
  if (!game.active) return;
  e.preventDefault();
  if (game.id === 'flappy') { game.bird.vy = -0.45; return; }
  const mx = e.clientX, my = e.clientY;
  if (game.id === 'catch') {
    for (let i = game.items.length - 1; i >= 0; i--) {
      const em = game.items[i], dx = mx - em.x, dy = my - em.y;
      if (dx*dx + dy*dy < 40*40) { game.score++; game.items.splice(i, 1); break; }
    }
  } else if (game.id === 'reaction') {
    for (let i = game.items.length - 1; i >= 0; i--) {
      const t = game.items[i], dx = mx - t.x, dy = my - t.y;
      if (dx*dx + dy*dy < 38*38) { game.score++; game.items.splice(i, 1); break; }
    }
  } else if (game.id === 'bounce') {
    const b = game.items[0];
    if (!b) return;
    const dx = mx - b.x, dy = my - b.y;
    if (dx*dx + dy*dy < (b.r + 15) * (b.r + 15)) {
      game.score++;
      b.x = 80 + Math.random() * (window.innerWidth - 160);
      b.y = 140 + Math.random() * (window.innerHeight - 240);
      b.vx = (Math.random() - 0.5) * 1.3;
      b.vy = (Math.random() - 0.5) * 1.3;
    }
  }
});

function endGame() {
  game.active = false;
  canvas.style.display = 'none';
  const names = { catch: 'Ловля сюрикенов', reaction: 'Удар молнии', bounce: 'Прыжок ниндзя', flappy: 'Полёт дракона' };
  const praise = game.score > 20 ? 'Ого, настоящий шиноби! 🏆'
               : game.score > 10 ? 'Неплохо, воин! 👏'
               : 'Тренируйся ещё, ученик 😄';
  setTimeout(() => {
    alert(`«${names[game.id]}» окончено!\nСчёт: ${game.score}\n${praise}`);
    showGamesMenu();
  }, 100);
}

/* ===== INIT ===== */
supabase.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) onSignedIn(session.user);
    if (event === 'SIGNED_OUT') { currentUser = null; showAuth(); }
  }, 0);
});

$('login-btn').addEventListener('click', doLogin);
$('register-btn').addEventListener('click', doRegister);
$('logout').addEventListener('click', doLogout);
$('menu-btn').addEventListener('click', showChatsList);
$('back-to-chat-from-list').addEventListener('click', () => showChat());
$('new-chat-btn').addEventListener('click', newChat);
$('play-btn').addEventListener('click', showGamesMenu);
$('close-games').addEventListener('click', () => showChat());
$('my-avatar').addEventListener('click', showProfile);
$('back-to-chat').addEventListener('click', () => showChat());
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) await onSignedIn(session.user);
  else showAuth();
})();
